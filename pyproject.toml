[project]
name = "ser"
version = "0.1.0"
description = "SER — Universal Local-First RAG Engine"
readme = "README.md"
authors = [
    { name = "Parth Mohnot", email = "150487691+parm2006@users.noreply.github.com" }
]
requires-python = ">=3.10"
dependencies = [
    "fastembed>=0.8.0",
    "httpx>=0.28.1",
    "mcp[cli]>=2.2.0",
    "numpy>=2.0.0",
    "pymupdf4llm>=1.28.2",
    "python-dotenv>=1.0.0",
    "qdrant-client>=1.12.0",
    "rich>=13.0.0",
    "winsdk>=1.0.0b10; sys_platform == 'win32'",
]

[project.optional-dependencies]
audio = ["faster-whisper>=1.0.0"]


[project.scripts]
ser = "ser:main"
simpleenglishrag = "ser:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"
